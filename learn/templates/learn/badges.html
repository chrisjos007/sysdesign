{% extends "learn/base.html" %}
{% block title %}Badges{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">🏅 Badges</h1>
<div class="grid gap-3 sm:grid-cols-2">
    {% for badge in all_badges %}
    <div class="rounded-lg border p-4 {% if badge.id in earned_ids %}border-amber-600 bg-amber-950/30{% else %}border-slate-800 bg-panel opacity-50{% endif %}">
        <div class="text-2xl mb-1">{{ badge.icon }}</div>
        <div class="font-semibold">{{ badge.name }}</div>
        <div class="text-xs text-slate-400">{{ badge.description }}</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
