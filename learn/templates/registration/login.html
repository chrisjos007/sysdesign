{% extends "learn/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-panel border border-slate-800 rounded-xl p-6">
    <h1 class="text-xl font-bold mb-4">⚡ Log in</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="block text-sm text-slate-400 mb-1">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-red-400 text-xs mt-1">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-accent text-white font-semibold px-4 py-2.5 rounded-lg hover:opacity-90">Log in</button>
    </form>
    <p class="text-sm text-slate-400 mt-4">No account? <a href="{% url 'learn:signup' %}" class="text-accent hover:underline">Sign up</a></p>
</div>
{% endblock %}
